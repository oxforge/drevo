# Every push and pull request: run the tests, then build the app.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    # Xcode 27 = the Swift 6.4 toolchain the project is developed with.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Test
        run: make test

      - name: Build app
        run: make app SIGN_ID=-
